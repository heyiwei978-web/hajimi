<main id="searchMain" class="site-search-main">
  <h1>全站搜索</h1>
  <p class="site-search-lead">一次查找病历模板、疾病分型、心电图、检验解读、临床路径和临床工具。</p>
  <form id="siteSearchForm" class="site-search-form" action="/search" method="get" role="search">
    <label for="siteSearchInput">搜索全站资料</label>
    <div class="site-search-field">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>

    <p>输入名称、缩写或别名即可；多个词用空格隔开，会同时匹配。</p>
    <ul class="site-search-examples">
      <li><a href="/search?q=%E8%82%A1%E9%AA%A8%E9%A2%88">股骨颈</a></li>

    </ul>
    <p class="site-search-scope">搜索范围是各栏目的标题、缩写和别名，不包含病历正文；查找某一份文书请到<a href="/bl">病历模板库</a>搜索。</p>
