<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="robots" content="noindex,nofollow">
<title>管理员密码设置 · 哈基米工作站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231d67d8%22/%3E%3Cpath d=%22M10 8v16m12-16v16M10 16h12%22 stroke=%22white%22 stroke-width=%223.5%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css?v=20261008-sticky-home1">
<link rel="stylesheet" href="/ui-polish.css?v=20261011-jump1">
<link rel="stylesheet" href="/accessibility.css?v=20261009-quality1">
<link rel="stylesheet" href="/duty.css?v=20261009-layout1">
<link rel="stylesheet" href="/workspace-design.css?v=20261011-layout2">
<style>
.hash-form{display:grid;gap:14px;max-width:440px}
.hash-form label{display:grid;gap:6px;font-weight:600}
.hash-form input{height:44px;border:1px solid #d5dce5;border-radius:8px;padding:0 12px;font-size:16px}
.hash-form .btn{justify-self:start;min-height:44px;padding:0 22px}
.hash-error{color:#b42318;margin:0}
.hash-result{margin-top:22px;display:grid;gap:10px}
.hash-result textarea{width:100%;min-height:96px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;border:1px solid #d5dce5;border-radius:8px;padding:10px;word-break:break-all;resize:vertical}
.hash-steps{margin:0;padding-left:20px;line-height:1.9}
</style>
</head>
<body class="duty-page">
<main class="duty-main">
  <section class="duty-hero"><div><p class="duty-kicker">ADMIN · PASSWORD</p><h1>管理员密码设置</h1><p>在这里生成新的密码校验码。密码只在本页面内计算，不会上传到任何地方。</p></div></section>
  <section class="duty-card">
    <form id="hashForm" class="hash-form" autocomplete="off">
      <label>新密码（至少 12 个字符）<input id="pw1" type="password" autocomplete="new-password" required></label>
      <label>再输入一次<input id="pw2" type="password" autocomplete="new-password" required></label>
      <p id="hashError" class="hash-error" role="alert" hidden></p>
      <button class="btn primary" type="submit">生成</button>
    </form>
    <div id="hashResult" class="hash-result" hidden>
      <strong>生成成功，下面这一串就是校验码：</strong>
      <textarea id="hashOutput" readonly></textarea>
      <button id="copyHash" class="btn ghost" type="button" style="justify-self:start">复制</button>
      <ol class="hash-steps">
        <li>点“复制”，把这串校验码发给 Claude，或自己填到 Vercel 的 <code>HAJIMI_ADMIN_PASSWORD_HASH</code>。</li>
        <li>重新部署后，用<b>新密码</b>登录。</li>
        <li>请记住新密码；校验码本身无法反推出密码。</li>
      </ol>
    </div>
  </section>
</main>
<script defer src="/password-hash.js?v=20261011-1"></script>
</body>
</html>
