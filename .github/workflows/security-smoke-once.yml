name: One-time production security smoke test

on:
  push:
    paths:
      - ".github/workflows/security-smoke-once.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test production security controls
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://wdyxzl.icu"
          ORIGIN="https://wdyxzl.icu"
          ADMIN_HEADER="X-Hajimi-Admin: 1"

          check_status() {
            local name="$1" expected="$2"; shift 2
            local code
            code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" "$@")
            echo "$name => HTTP $code"
            head -c 500 /tmp/body.txt || true
            echo
            if [ "$code" != "$expected" ]; then
              echo "::error::$name expected HTTP $expected but got $code"
              exit 1
            fi
          }

          echo "== Basic reachability =="
          check_status "session endpoint" "200" "$BASE/api/session"
          check_status "removed audit endpoint" "404" "$BASE/api/ortho-audit-runtime"

          echo "== Edge/method protection =="
          check_status "GET login denied at edge" "403" -X GET "$BASE/api/login"

          echo "== CSRF / unauthenticated write protection =="
          check_status "cross-site login rejected" "403"             -X POST "$BASE/api/login"             -H "Origin: https://evil.example"             -H "$ADMIN_HEADER"             -H "Content-Type: application/json"             --data '{"username":"nobody","password":"wrong"}'

          check_status "unauthenticated CMS PUT rejected" "401"             -X PUT "$BASE/api/content"             -H "Origin: $ORIGIN"             -H "$ADMIN_HEADER"             -H "Content-Type: application/json"             --data '{"templateOverrides":{},"cases":[]}'

          echo "== Payload limit =="
          python3 - <<'PY' >/tmp/big.json
          import json
          print(json.dumps({"username":"nobody","password":"x"*6000}))
          PY
          check_status "oversized login payload rejected" "413"             -X POST "$BASE/api/login"             -H "Origin: $ORIGIN"             -H "$ADMIN_HEADER"             -H "Content-Type: application/json"             --data-binary @/tmp/big.json

          echo "== Brute-force throttle =="
          final=""
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/login-body.txt -w "%{http_code}"               -X POST "$BASE/api/login"               -H "Origin: $ORIGIN"               -H "$ADMIN_HEADER"               -H "Content-Type: application/json"               --data '{"username":"security-smoke-nobody","password":"definitely-wrong"}')
            echo "attempt $i => HTTP $code"
            final="$code"
            if [ "$i" -lt 10 ] && [ "$code" != "401" ] && [ "$code" != "429" ]; then
              echo "::error::unexpected login response $code on attempt $i"
              exit 1
            fi
            if [ "$code" = "429" ]; then
              break
            fi
          done
          if [ "$final" != "429" ]; then
            echo "::error::login throttle did not reach HTTP 429 within 10 failed attempts"
            cat /tmp/login-body.txt || true
            exit 1
          fi

          echo "== Security headers =="
          curl -sS -D /tmp/headers.txt -o /dev/null "$BASE/"
          tr -d '\r' </tmp/headers.txt | tee /tmp/headers-clean.txt
          for header in             "strict-transport-security:"             "content-security-policy:"             "x-frame-options:"             "x-content-type-options:"             "x-robots-tag:"             "cross-origin-opener-policy:"             "cross-origin-resource-policy:"; do
            grep -qi "^$header" /tmp/headers-clean.txt || {
              echo "::error::missing security header $header"
              exit 1
            }
          done

          echo "== Common scanner paths =="
          check_status ".env denied" "403" "$BASE/.env"
          check_status ".git/config denied" "403" "$BASE/.git/config"
          check_status "wp-login denied" "403" "$BASE/wp-login.php"
          check_status "phpMyAdmin denied" "403" "$BASE/phpmyadmin/"

          echo "== Request-shape protection =="
          check_status "missing admin marker rejected" "403" \
            -X POST "$BASE/api/login" \
            -H "Origin: $ORIGIN" \
            -H "Content-Type: application/json" \
            --data '{"username":"nobody","password":"wrong"}'

          check_status "wrong content type rejected" "415" \
            -X POST "$BASE/api/login" \
            -H "Origin: $ORIGIN" \
            -H "$ADMIN_HEADER" \
            -H "Content-Type: text/plain" \
            --data 'not-json'

          check_status "malformed JSON rejected" "400" \
            -X POST "$BASE/api/login" \
            -H "Origin: $ORIGIN" \
            -H "$ADMIN_HEADER" \
            -H "Content-Type: application/json" \
            --data '{"username":'

          echo "== API cache policy =="
          curl -sS -D /tmp/session-headers.txt -o /dev/null "$BASE/api/session"
          tr -d '\r' </tmp/session-headers.txt | grep -qi '^cache-control:.*no-store' || {
            echo "::error::session endpoint missing Cache-Control: no-store"
            exit 1
          }

          echo "ALL SECURITY SMOKE TESTS PASSED"
