name: Offsite data backup

# 每周把 Vercel Blob 中的站点数据（后台内容及历史、值班资料、AI 病历案例、私人图库、登录与错误记录）
# 完整下载、校验、加密后存为本仓库的 Actions 构件，保留 90 天。说明与恢复步骤见 docs/backup.md。
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 中设置：
#   BLOB_READ_WRITE_TOKEN  与 Vercel 项目中同名环境变量的值相同
#   BACKUP_PASSPHRASE      加密口令（至少 20 个字符），另行离线保存；丢失后备份无法解密
on:
  schedule:
    - cron: '17 19 * * 6'   # 每周六 19:17 UTC（北京时间周日 03:17）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blob-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::请先在仓库 Secrets 中设置 BLOB_READ_WRITE_TOKEN 和 BACKUP_PASSPHRASE（见 docs/backup.md）"
            exit 1
          fi
          if [ ${#BACKUP_PASSPHRASE} -lt 20 ]; then
            echo "::error::BACKUP_PASSPHRASE 至少需要 20 个字符"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download and verify
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/backup-blob.mjs "$RUNNER_TEMP/backup"
      - name: Encrypt
        id: pack
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          stamp=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p "$RUNNER_TEMP/out"
          tar -C "$RUNNER_TEMP/backup" -czf - . \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:BACKUP_PASSPHRASE \
            -out "$RUNNER_TEMP/out/hajimi-blob-$stamp.tar.gz.enc"
          rm -rf "$RUNNER_TEMP/backup"
          (cd "$RUNNER_TEMP/out" && sha256sum "hajimi-blob-$stamp.tar.gz.enc" > "hajimi-blob-$stamp.sha256")
          echo "name=hajimi-blob-$stamp" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 90
          if-no-files-found: error
