# 每月检查一次依赖和 GitHub Actions 的安全更新，以 PR 形式提出。
# 这些 PR 同样要等 CI 通过、由站点负责人审核后才能合并（AGENTS.md 第 0 节）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(ci)
